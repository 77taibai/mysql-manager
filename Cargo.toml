[package]
name = "mm"
version = "0.1.0"
edition = "2021"
description = "Windows MySQL instance manager: on-demand start/stop, database/user management with exclusive binding"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.9"

[profile.release]
opt-level = "z"
lto = true
strip = true
